<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        :root {
            --navy-blue: #2d5a7b;
            --cream-bg: #fcfaf2;
            --accent-gold: #ebdcb9;
            --text-dark: #2c3e50;
            --soft-blue: #eef5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Fixed-size top header for branding branding */
        header {
            background-color: var(--navy-blue);
            color: white;
            text-align: center;
            padding: 15px 20px;
            border-bottom: 4px solid var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        /* Central Flex Workspace that handles fluid rendering */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        /* This wrapper completely dictates dynamic image sizing */
        .dynamic-flyer-box {
            width: 100%;
            /* 1. Dynamic Width Rules */
            max-width: 75vw; /* Never wider than 75% of the total screen width */
            
            /* 2. Dynamic Height Rules */
            /* Limits height so the flyer comfortably leaves breathing room for headers/footers */
            max-height: 70vh; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .flyer-img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Ensures the aspect ratio is never broken */
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(45, 90, 123, 0.12);
            border: 1px solid var(--accent-gold);
            transition: all 0.2s ease-in-out;
        }

        /* Clean, non-intrusive Contact Dashboard Area */
        .info-panel {
            width: 100%;
            max-width: 700px;
            background: white;
            border-top: 4px solid var(--navy-blue);
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            flex-shrink: 0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .info-card h3 {
            color: var(--navy-blue);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .info-card p {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        footer {
            text-align: center;
            padding: 15px 20px;
            color: var(--navy-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            background-color: #f3efe0;
            border-top: 1px solid var(--accent-gold);
            flex-shrink: 0;
        }

        /* Adaptive view rules for mobile screens */
        @media (max-width: 600px) {
            .dynamic-flyer-box {
                max-width: 95vw;
                max-height: 65vh;
            }
            .info-grid {
                grid-template-columns: 1fr;
                text-align: left;
            }
            .info-panel {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcoming Little Minds</h1>
    </header>

    <div class="main-content">

        <div class="dynamic-flyer-box">
            <img src="wonderbloommontessori_v2.png" alt="Wonderbloom Montessori Home Program Flyer" class="flyer-img">
        </div>

        <div class="info-panel">
            <div class="info-grid">
                <div class="info-card">
                    <h3>Contact Person</h3>
                    <p>Geetha Rani Nadukuru</p>
                </div>
                <div class="info-card">
                    <h3>Phone Line</h3>
                    <p>+1 248 832 6701</p>
                </div>
                <div class="info-card">
                    <h3>Email Link</h3>
                    <p style="word-break: break-all;">wonderbloommontessori@gmail.com</p>
                </div>
            </div>
        </div>

    </div>

    <footer>
        Growing, Learning, & Thriving Together
    </footer>

</body>
</html>

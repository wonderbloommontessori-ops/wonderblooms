<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fcfaf2; /* Matches the warm cream background of the flyer */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            min-height: 100vh;
        }

        .full-page-container {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flyer-img {
            width: 100%;
            max-width: 1000px; /* Expands the flyer to fill the screen on desktop */
            height: auto !important; /* Locks the correct aspect ratio completely */
            display: block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        footer {
            padding: 25px 0;
            font-size: 0.9rem;
            color: #556877;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            width: 100%;
            background-color: #fcfaf2;
        }
    </style>
</head>
<body>

    <div class="full-page-container">
        <img src="wonderbloommontessori_v2.png" alt="Wonderbloom Montessori Home Flyer" class="flyer-img">
        <footer>
            Growing, Learning, & Thriving Together
        </footer>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        :root {
            --primary-blue: #2d5a7b;
            --accent-gold: #f5eedc;
            --cream-bg: #fdfaf4;
            --text-dark: #2c3e50;
            --text-light: #576574;
            --leaf-green: #7fa99b;
            --soft-orange: #f3a683;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Graphical Hero Header */
        .hero-banner {
            background: radial-gradient(circle at top left, #eef5f9 0%, #fdfaf4 80%);
            padding: 60px 20px;
            text-align: center;
            position: relative;
            border-bottom: 4px dashed #ebdcb9;
            overflow: hidden;
        }

        /* Decorative playful star shapes mimicking the flyer */
        .hero-banner::before, .hero-banner::after {
            content: "★";
            position: absolute;
            color: var(--soft-orange);
            font-size: 1.5rem;
            opacity: 0.7;
        }
        .hero-banner::before { top: 20px; left: 10%; transform: rotate(15deg); }
        .hero-banner::after { bottom: 20px; right: 10%; transform: rotate(-25deg); }

        .hero-banner h1 {
            color: var(--primary-blue);
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .hero-banner h2 {
            font-size: 1.4rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .enrollment-badge {
            display: inline-block;
            background-color: #d9534f;
            color: white;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 50px;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 20px rgba(217, 83, 79, 0.25);
            border: 2px solid white;
        }

        /* Main Center Frame */
        .main-layout {
            max-width: 1100px;
            width: 90%;
            margin: 50px auto;
        }

        /* Visual Graphic Container for the Center Image */
        .image-frame-container {
            background: white;
            padding: 15px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.04);
            border: 1px solid #ebdcb9;
            margin-bottom: 60px;
            text-align: center;
        }

        .image-display {
            width: 100%;
            height: 480px;
            background-color: #eef2f5;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-style: italic;
            border: 2px dashed #cbdce6;
            position: relative;
        }

        /* Dynamic Visual Grid for Pillars */
        .features-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .feature-block {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            position: relative;
            border: 1px solid #ebdcb9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .feature-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(45, 90, 123, 0.08);
            border-color: var(--primary-blue);
        }

        /* Visual Stylized Icon Circles */
        .icon-circle {
            width: 65px;
            height: 65px;
            border-radius: 50px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            color: white;
        }

        .bg-blue   { background-color: #5c85a6; }
        .bg-green  { background-color: #8cb1a3; }
        .bg-yellow { background-color: #e6c887; }
        .bg-orange { background-color: #eaa385; }
        .bg-purple { background-color: #aba3c4; }
        .bg-teal   { background-color: #8bc3cc; }

        .feature-block h3 {
            color: var(--primary-blue);
            font-size: 1.25rem;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .feature-block p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Stylized Split Schedule Panel */
        .panel-schedule {
            background-color: var(--accent-gold);
            border-radius: 24px;
            padding: 45px;
            margin-bottom: 60px;
            border: 2px dashed #d5c8b0;
        }

        .panel-schedule h2 {
            text-align: center;
            color: var(--primary-blue);
            font-size: 2rem;
            text-transform: uppercase;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .split-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .panel-col {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        .panel-col h3 {
            color: var(--primary-blue);
            border-bottom: 3px solid var(--primary-blue);
            padding-bottom: 8px;

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1e0eb; /* Soft blue background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
        }

        .wrapper {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            text-align: center;
        }

        /* This wrapper ensures portrait images load flawlessly without squishing */
        .img-container {
            width: 100%;
            display: block;
        }

        .flyer-img {
            width: 100%;
            display: block;
            height: auto !important; /* Forces natural proportions */
            border-radius: 12px;
        }

        footer {
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #556877;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="wrapper">
            <div class="img-container">
                <!-- IMPORTANT: Change wonderbloommontessori_v2.png below to your exact file name if different -->
                <img src="wonderbloommontessori_v2.png" alt="Wonderbloom Montessori Home Flyer" class="flyer-img">
            </div>
            <footer>
                Growing, Learning, & Thriving Together
            </footer>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1e0eb; /* Warm, soft blue background that complements the flyer borders */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 650px; /* Prevents the vertical flyer from stretching too wide on desktop */
            width: 100%;
            text-align: center;
        }

        .flyer-img {
            width: 100%;
            height: auto; /* Ensures aspect ratio is completely locked, stopping distortion */
            display: block;
            border-radius: 12px;
        }

        footer {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #556877;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Replaces the distorted layout with the exact image file from your repository -->
        <img src="wonderbloommontessori_v2.png" alt="Wonderbloom Montessori Home Flyer" class="flyer-img">
        <footer>
            Growing, Learning, & Thriving Together
        </footer>
    </div>

</body>
</html>

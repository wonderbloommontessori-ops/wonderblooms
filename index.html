<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1e0eb; /* Soft blue background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
        }

        .wrapper {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 650px; /* Controls maximum width on desktop */
            width: 100%;
            margin: 0 auto; /* Centers the flyer horizontally */
            text-align: center;
        }

        .flyer-img {
            width: 100%;
            height: auto !important; /* Forces the correct, un-squished aspect ratio */
            display: block;
            border-radius: 12px;
        }

        footer {
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #556877;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="flyer.png" alt="Wonderbloom Montessori Home Flyer" class="flyer-img">
        <footer>
            Growing, Learning, & Thriving Together
        </footer>
    </div>

</body>
</html>

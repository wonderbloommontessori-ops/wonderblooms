<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderbloom Montessori Home | Now Accepting Enrollments</title>
    <style>
        :root {
            --navy-blue: #2d5a7b;
            --cream-bg: #fcfaf2;
            --accent-gold: #ebdcb9;
            --text-dark: #2c3e50;
            --soft-blue: #eef5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            width: 100%;
            min-height: 100vh;
        }

        /* Large Graphical Header Block */
        header {
            background-color: var(--navy-blue);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 6px solid var(--accent-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        header p {
            font-size: 1.25rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Main Scrollable Canvas Area */
        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Large Display Frame for the Flyer Graphic */
        .flyer-frame {
            background: white;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(45, 90, 123, 0.1);
            border: 2px solid var(--accent-gold);
            max-width: 850px; /* Expands the flyer beautifully on desktop */
            width: 100%;
            margin-bottom: 40px;
        }

        .flyer-img {
            width: 100%;
            height: auto !important; /* Locks correct portrait aspect ratio, stopping all distortion */
            display: block;
            border-radius: 12px;
        }

        /* Full Width Action Section */
        .action-container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-top: 5px solid var(--navy-blue);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .action-container h2 {
            color: var(--navy-blue);
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Dynamic Contact Grid Box */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            text-align: left;
            margin-top: 20px;
        }

        .contact-item {
            background-color: var(--soft-blue);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--accent-gold);
        }

        .contact-item h3 {
            color: var(--navy-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .contact-item p {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--navy-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.95rem;
            background-color: #f3efe0;
            margin-top: 60px;
            border-top: 1px solid var(--accent-gold);
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            header p { font-size: 1rem; }
            .flyer-frame { padding: 10px; border-radius: 16px; }
            .action-container { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcoming Little Minds</h1>
        <p>To A Nurturing Montessori Home</p>
    </header>

    <div class="page-wrapper">

        <div class="flyer-frame">
            <img src="wonderbloommontessori_v2.png" alt="Wonderbloom Montessori Program Flyer" class="flyer-img">
        </div>

        <div class="action-container">
            <h2>Connect With Us Directly</h2>
            <div class="contact-grid">
                <div class="contact-item">
                    <h3>Contact Name</h3>
                    <p>Geetha Rani Nadukuru</p>
                </div>
                <div class="contact-item">
                    <h3>Phone Number</h3>
                    <p>+1 248 832 6701</p>
                </div>
                <div class="contact-item">
                    <h3>Email Address</h3>
                    <p style="word-break: break-all;">wonderbloommontessori@gmail.com</p>
                </div>
            </div>
        </div>

    </div>

    <footer>
        Growing, Learning, & Thriving Together
    </footer>

</body>
</html>
